    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&family=Crimson+Pro:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['"Inter"', 'sans-serif'],
              mono: ['"JetBrains Mono"', 'monospace'],
              serif: ['"Crimson Pro"', 'serif'],
            },
            colors: {
              medical: {
                50: '#f0fdfa',
                100: '#ccfbf1',
                200: '#99f6e4',

                400: '#2dd4bf',

    <style>
      :root {
        --a4-width: 210mm;
        --a4-height: 297mm;
        --page-padding: 25mm;
      }
      
      body {
        background-color: #020617;
        color: #f8fafc;
        margin: 0;
      }

      /* Scrollbar */
      ::-webkit-scrollbar { width: 6px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
      ::-webkit-scrollbar-thumb:hover { background: #475569; }

      /* A4 Professional Page Styles */
      .a4-page {
        width: var(--a4-width);
        height: var(--a4-height);
        padding: var(--page-padding);
        background: white;
        color: #000;
        box-shadow: 0 0 40px rgba(0,0,0,0.15);
        margin: 40px auto;
        box-sizing: border-box;
        overflow: hidden;
        position: relative;
        display: flex;
        flex-direction: column;
        transition: transform 0.3s ease;
      }

      .a4-content {
        width: 100%;
        height: 100%;
        overflow: hidden;
        font-family: "Crimson Pro", serif;
        font-size: 11.5pt;
        line-height: 1.5;
        text-align: justify;
      }

      .a4-page:hover {
        transform: scale(1.005);
      }

      .page-footer {
        position: absolute;
        bottom: 12mm;
        left: var(--page-padding);
        right: var(--page-padding);
        border-top: 0.2pt solid #e2e8f0;
        padding-top: 4mm;
        font-family: "Inter", sans-serif;
        font-size: 8pt;
        color: #94a3b8;
        display: flex;
        justify-content: space-between;
      }

      .scan-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: linear-gradient(to bottom, transparent, rgba(20, 184, 166, 0.02), transparent);
        pointer-events: none;
        z-index: 100;
        animation: scan 10s linear infinite;
      }

      @keyframes scan {
        0% { transform: translateY(-100%); }
        100% { transform: translateY(100vh); }
      }

      @media print {
        @page {
          size: A4;
          margin: 0;
        }
        body {
          background: white !important;
        }
        .a4-page {
          margin: 0 !important;
          box-shadow: none !important;
          page-break-after: always;
          transform: none !important;
        }
        .no-print {
          display: none !important;
        }
      }
    </style>
